<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>나의 To-do List</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="auth-panel" id="authPanel" aria-labelledby="authTitle">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">✓</span>
          <div>
            <h1 id="authTitle">나의 To-do List</h1>
            <p>비밀번호를 입력하면 할 일 목록을 볼 수 있습니다.</p>
          </div>
        </div>

        <form class="auth-form" id="authForm">
          <label for="passwordInput">비밀번호</label>
          <div class="password-row">
            <input
              id="passwordInput"
              type="password"
              autocomplete="current-password"
              placeholder="비밀번호 입력"
              required
            />
            <button type="submit">열기</button>
          </div>
          <p class="auth-error" id="authError" role="alert"></p>
        </form>
      </section>

      <section class="todo-app hidden" id="todoApp" aria-labelledby="appTitle">
        <header class="app-header">
          <div>
            <p class="eyebrow">Private checklist</p>
            <h1 id="appTitle">나의 To-do List</h1>
          </div>
          <button class="ghost-button" id="lockButton" type="button">잠그기</button>
        </header>

        <form class="todo-form" id="todoForm">
          <div class="field item-field">
            <label for="itemInput">항목 <span aria-hidden="true">*</span></label>
            <input id="itemInput" type="text" placeholder="할 일을 입력하세요" required />
          </div>

          <div class="field">
            <label for="dueInput">기한</label>
            <input id="dueInput" type="date" />
          </div>

          <div class="field description-field">
            <label for="descriptionInput">설명</label>
            <textarea id="descriptionInput" rows="3" placeholder="설명을 입력하세요"></textarea>
          </div>

          <button class="primary-button" type="submit">추가</button>
        </form>

        <div class="list-tools">
          <p id="todoCount">0개 항목</p>
          <button class="text-button" id="clearDoneButton" type="button">완료 항목 삭제</button>
        </div>

        <p class="sync-status" id="syncStatus" role="status"></p>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th scope="col">완료</th>
                <th scope="col">입력일시</th>
                <th scope="col">항목</th>
                <th scope="col">기한</th>
                <th scope="col">관리</th>
              </tr>
            </thead>
            <tbody id="todoList"></tbody>
          </table>
        </div>

        <div class="empty-state" id="emptyState">
          <h2>아직 입력된 항목이 없습니다.</h2>
          <p>새 할 일을 추가하면 기한이 가까운 순서로 자동 정렬됩니다.</p>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
